# docker_learn stack: the user-directory FastAPI app (user_api) and its PostgreSQL (postgres_cont).
# Recreates the old Portainer stack "docker_learn" with the same names, so the existing data
# volume docker_learn_pg_data is reused.
#
#   cd C:\Projects\docker
#   docker compose -p docker_learn -f docker_learn.compose.yaml up -d --build
#
# Values come from .env in this folder (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB).
# Ports listen on this computer only.
name: docker_learn

services:
  postgres_cont:
    image: postgres:17
    container_name: postgres_cont
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  user_api:
    build:
      context: .
      dockerfile: service/Dockerfile
    image: user-directory-api
    container_name: user_api
    environment:
      DB_CONN: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_cont:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres_cont:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
